name: Development issue dashboard
on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, closed, ready_for_review, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: guitar-practice-development-dashboard
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub development dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/audit_feedback_batch.py
