<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
 <title id="title">Guitar Practice Lab</title>
 <desc id="desc">Vibrant vintage hollow-body jazz guitar emblem, with a honey-and-coral sunburst, carved f-holes, golden strings and teal rhythm lines.</desc>
 <defs>
  <radialGradient id="night" cx=".18" cy=".12" r="1.25"><stop stop-color="#633b63"/><stop offset=".55" stop-color="#27233e"/><stop offset="1" stop-color="#101b2d"/></radialGradient>
  <radialGradient id="wood" cx=".40" cy=".39" r=".73"><stop stop-color="#ffe5a1"/><stop offset=".30" stop-color="#ffc267"/><stop offset=".63" stop-color="#ee8050"/><stop offset=".85" stop-color="#c04d5d"/><stop offset="1" stop-color="#863f65"/></radialGradient>
  <linearGradient id="finger" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#392938"/><stop offset=".52" stop-color="#62414a"/><stop offset="1" stop-color="#2e293d"/></linearGradient>
  <linearGradient id="binding" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff0bb"/><stop offset=".55" stop-color="#eead69"/><stop offset="1" stop-color="#ffdca1"/></linearGradient>
  <filter id="halo"><feGaussianBlur stdDeviation="8"/></filter>
