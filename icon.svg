<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
<title id="title">Guitar Practice Lab</title>
<desc id="desc">Amber hollow-body jazz guitar with paired f-holes and golden strings on a plum and midnight background.</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#402c43"/>
  <stop offset=".55" stop-color="#28253a"/>
  <stop offset="1" stop-color="#142a32"/>
 </linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f6c582"/>
  <stop offset=".46" stop-color="#dc8b57"/>
  <stop offset="1" stop-color="#ad5262"/>
 </linearGradient>
 <linearGradient id="finger" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#4c303c"/>
  <stop offset="1" stop-color="#71515a"/>
 </linearGradient>
</defs>
<rect width="120" height="120" rx="27" fill="url(#night)"/>
<circle cx="91" cy="26" r="29" fill="#6a8790" opacity=".13"/>
<path d="M14 98 Q33 115 54 113 M75 12 Q105 20 107 49" fill="none" stroke="#a9b1a4" stroke-width="2" stroke-linecap="round" opacity=".38"/>
<!-- Neck and decorative headstock: archtop proportions, not a brand-specific guitar outline -->
<path d="M55 11 Q52 7 50 13 L52 23 L54 27 L54 47 L66 47 L66 27 L68 23 L70 13 Q66 7 63 11 Z" fill="url(#finger)" stroke="#f8c987" stroke-width="1.8"/>
