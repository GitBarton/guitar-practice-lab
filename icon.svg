<circle cx="49" cy="15" r="1.8" fill="#f6d39d"/><circle cx="71" cy="15" r="1.8" fill="#f6d39d"/>
<circle cx="49" cy="22" r="1.8" fill="#f6d39d"/><circle cx="71" cy="22" r="1.8" fill="#f6d39d"/>
<!-- Offset double-cut hollow-body soundbox -->
<path d="M56 43 C45 34 30 40 29 55 C28 63 37 70 38 77 C39 83 31 89 34 99 C39 115 53 113 60 109 C67 113 81 115 86 99 C89 89 81 83 82 77 C83 70 92 63 91 55 C90 40 75 34 64 43 L64 50 Q60 54 56 50 Z"
 fill="url(#wood)" stroke="#f6d49b" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M43 49 C31 60 42 72 44 78 C47 86 38 95 43 101 M77 49 C89 60 78 72 76 78 C73 86 82 95 77 101"
 stroke="#fde3b3" stroke-width="2" opacity=".48" fill="none" stroke-linecap="round"/>
<!-- Two unmistakable carved archtop f-holes -->
<path d="M45 62 C39 65 42 70 46 73 C49 76 42 84 44 91" fill="none" stroke="#462e3d" stroke-width="4" stroke-linecap="round"/>
<path d="M75 62 C81 65 78 70 74 73 C71 76 78 84 76 91" fill="none" stroke="#462e3d" stroke-width="4" stroke-linecap="round"/>
<path d="M45 61 L40 64 M44 91 L49 89 M75 61 L80 64 M76 91 L71 89" stroke="#462e3d" stroke-width="2.6" stroke-linecap="round"/>
<rect x="53" y="78" width="14" height="4" rx="1.8" fill="#432b3a"/>
<path d="M51 96 Q60 99 69 96 L66 104 L54 104 Z" fill="#503442" stroke="#ffd39a" stroke-width="1.1"/>
<path d="M57 13 L57 97 M59 13 L59 97 M61 13 L61 97 M63 13 L63 97" stroke="#fff0c7" stroke-width=".9" opacity=".9"/>
<path d="M57 54 H63" stroke="#fff3cf" stroke-width="2.3" stroke-linecap="round"/>
